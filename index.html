<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fcf9f5">
<title>Paletas de color</title>
<style>
  :root { color-scheme: light; --ink:#39352f; --muted:#827b73; --paper:#fcf9f5; --line:#ece5dd; --accent:#965e42; }
  * { box-sizing:border-box }
  body { margin:0; padding:clamp(16px,4vw,38px); background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif }
  .wrap { max-width:1050px; margin:auto }
  header { text-align:center; margin:0 auto 30px; max-width:620px }
  h1 { font-family:"Palatino Linotype",Palatino,Georgia,serif; font-weight:500; font-size:clamp(2rem,5vw,3rem); margin:0 0 8px; letter-spacing:-.035em }
  .intro { margin:0; color:var(--muted); line-height:1.6; font-size:.98rem }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:20px }
  .card { overflow:hidden; border:1px solid var(--line); border-radius:18px; background:#fff; box-shadow:0 5px 18px #4935210a }
  .cover { min-height:158px; display:flex; flex-direction:column; justify-content:flex-end; padding:20px 22px; position:relative; isolation:isolate; color:var(--cover-ink,#fff) }
  .cover::after { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(0deg,#0002,transparent 72%) }
  .cover .eyebrow { font-size:.68rem; text-transform:uppercase; letter-spacing:.15em; opacity:.88; margin-bottom:3px }
  .cover h2 { font-family:"Palatino Linotype",Palatino,Georgia,serif; font-size:2rem; font-weight:500; line-height:1.05; margin:0 0 7px; font-style:italic; text-shadow:0 1px 4px #0002 }
  .base { display:inline-flex; align-items:center; gap:7px; font:500 .78rem ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.025em; background:#00000016; padding:5px 9px; border-radius:99px; width:max-content }
  .swatches { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; padding:15px 15px 11px }
  .swatch { border:0; background:none; color:inherit; min-width:0; padding:0; text-align:center; cursor:pointer; border-radius:9px; font:inherit }
  .swatch:focus-visible,.copy-all:focus-visible { outline:3px solid #965e4280; outline-offset:3px }
  .chip { height:47px; display:block; border-radius:10px; border:1px solid #00000012; margin-bottom:6px; transition:transform .15s,box-shadow .15s }
  .swatch:hover .chip { transform:translateY(-2px); box-shadow:0 4px 10px #392b201c }
  .hex { display:block; color:#655e56; font: .63rem ui-monospace,SFMono-Regular,Menlo,monospace; white-space:nowrap; letter-spacing:-.035em }
  .card-foot { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:4px 16px 15px; color:var(--muted); font-size:.74rem }
  .copy-all { appearance:none; border:1px solid var(--line); background:#fff; color:#51483f; border-radius:99px; padding:8px 12px; cursor:pointer; font:600 .75rem inherit; transition:background .15s,border-color .15s }
  .copy-all:hover { background:#f8f3ee; border-color:#d8c9bb }
  #toast { position:fixed; left:50%; bottom:22px; transform:translate(-50%,12px); opacity:0; pointer-events:none; background:#39352f; color:white; padding:11px 16px; border-radius:99px; font-size:.86rem; box-shadow:0 8px 28px #0002; transition:opacity .18s,transform .18s; z-index:5 }
  #toast.show { opacity:1; transform:translate(-50%,0) }
  @media(max-width:390px) { .swatches {gap:5px;padding-inline:11px}.chip{height:40px}.hex{font-size:.57rem}.cover{min-height:142px} }
  @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important;scroll-behavior:auto!important } }
</style>
</head>
<body>
<main class="wrap">
  <header><h1>Paletas de color</h1><p class="intro">Elige una combinación para darle color a tu agenda. Toca cualquier muestra para copiar su HEX, o copia la paleta completa.</p></header>
  <section class="grid" id="palettes" aria-label="Seis paletas de color"></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const palettes = [
  {name:"Rosewood", colors:["#D1B0A7","#F3DDD2","#B98791","#E7B9AA","#805D68"]},
  {name:"Sundrop", colors:["#DEA053","#F6D66B","#E87948","#F1AC72","#B66B3D"]},
  {name:"Sagewood", colors:["#CCCCAD","#A8B7A0","#778B83","#D8D1B8","#8F9A78"]},
  {name:"Canyon", colors:["#965E42","#C07852","#D9926D","#B8513C","#E3B280"]},
  {name:"Wisteria", colors:["#CCB9C9","#A891BA","#8675A9","#D9A9C7","#B985AC"]},
  {name:"Moss", colors:["#4D5235","#73834B","#A1A56B","#C9AD69","#7C7658"]}
];
const root=document.getElementById('palettes');
const toast=document.getElementById('toast');
let toastTimer;
function textColor(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>155?'#39352f':'#fff'}
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1700)}
async function copy(value,label){
  try { if(navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(value); else { const field=document.createElement('textarea');field.value=value;field.setAttribute('readonly','');field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();const ok=document.execCommand('copy');field.remove();if(!ok)throw new Error('copy failed') } showToast(label); }
  catch { showToast('No se pudo copiar. Mantén presionado para copiar el HEX.'); }
}
root.innerHTML=palettes.map((p,i)=>{
 const base=p.colors[0];
 return `<article class="card"><div class="cover" style="background:${base};--cover-ink:${textColor(base)}"><span class="eyebrow">Paleta ${String(i+1).padStart(2,'0')}</span><h2>${p.name}</h2><span class="base">${base}</span></div><div class="swatches">${p.colors.map((c,j)=>`<button class="swatch" type="button" data-hex="${c}" aria-label="Copiar ${c}, color ${j+1} de ${p.name}" title="Copiar ${c}"><span class="chip" style="background:${c}"></span><span class="hex">${c}</span></button>`).join('')}</div><div class="card-foot"><span>5 colores · toca para copiar</span><button class="copy-all" type="button" data-palette="${i}">Copiar paleta</button></div></article>`
}).join('');
root.addEventListener('click',e=>{const sw=e.target.closest('[data-hex]');if(sw){copy(sw.dataset.hex,`¡${sw.dataset.hex} copiado!`);return}const all=e.target.closest('[data-palette]');if(all){const p=palettes[Number(all.dataset.palette)];copy(p.colors.join('\n'),`¡Paleta ${p.name} copiada!`)}});
</script>
</body>
</html>
